# shakibhowlader.online behind the host nginx; pairs with docker-compose.prod.yml.
# Installed by deploy/install-nginx.sh as /etc/nginx/sites-available/shakibhowlader.online

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shakibhowlader.online;

    ssl_certificate     /etc/letsencrypt/live/shakibhowlader.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shakibhowlader.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Admin uploads are capped at 15 MB (MAX_UPLOAD_BYTES in src/lib/uploads.ts).
    client_max_body_size 16M;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shakibhowlader.online;

    ssl_certificate     /etc/letsencrypt/live/shakibhowlader.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shakibhowlader.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://shakibhowlader.online$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name shakibhowlader.online www.shakibhowlader.online;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / { return 301 https://shakibhowlader.online$request_uri; }
}
